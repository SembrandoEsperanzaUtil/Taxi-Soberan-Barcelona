<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Red de Honor - AMB | Taxi Soberano</title>
  <style>
    :root {
      --bg-color: #0d1117;
      --card-bg: #161b22;
      --border-color: #30363d;
      --accent-blue: #38bdf8; /* Azul cielo */
      --accent-hover: #0ea5e9;
      --text-main: #f0f6fc;
      --text-muted: #8b949e;
      --terminal-bg: #000000;
      --terminal-green: #3fb950;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-main);
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
    }

    .panel-container {
      background-color: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 12px;
      width: 100%;
      max-width: 520px;
      padding: 24px;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.5);
    }

    .header {
      text-align: center;
      margin-bottom: 24px;
      border-bottom: 1px solid var(--border-color);
      padding-bottom: 16px;
    }

    .header h1 {
      font-size: 1.4rem;
      color: var(--accent-blue);
      letter-spacing: 0.5px;
      text-transform: uppercase;
    }

    .header p {
      font-size: 0.85rem;
      color: var(--text-muted);
      margin-top: 4px;
    }

    .form-group {
      margin-bottom: 18px;
    }

    label {
      display: block;
      font-size: 0.85rem;
      font-weight: 600;
      color: var(--text-muted);
      margin-bottom: 8px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    select {
      width: 100%;
      padding: 12px;
      background-color: #21262d;
      border: 1px solid var(--border-color);
      border-radius: 8px;
      color: var(--text-main);
      font-size: 0.95rem;
      outline: none;
      transition: border-color 0.2s;
    }

    select:focus {
      border-color: var(--accent-blue);
    }

    .btn-transmitir {
      width: 100%;
      padding: 14px;
      background-color: var(--accent-blue);
      color: #041019;
      border: none;
      border-radius: 8px;
      font-size: 1rem;
      font-weight: 700;
      cursor: pointer;
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 8px;
      transition: background-color 0.2s, transform 0.1s;
      margin-top: 8px;
      margin-bottom: 20px;
    }

    .btn-transmitir:hover {
      background-color: var(--accent-hover);
    }

    .btn-transmitir:active {
      transform: scale(0.98);
    }

    .consola-wrapper {
      background-color: var(--terminal-bg);
      border: 1px solid var(--border-color);
      border-radius: 8px;
      padding: 14px;
      min-height: 75px;
      display: flex;
      align-items: center;
    }

    .consola-texto {
      font-family: "Courier New", Courier, monospace;
      font-size: 0.88rem;
      color: var(--terminal-green);
      line-height: 1.4;
      word-break: break-word;
    }
  </style>
</head>
<body>

  <div class="panel-container">
    <div class="header">
      <h1>Red de Honor - AMB</h1>
      <p>Operativa Taxi Soberano Barcelona</p>
    </div>

    <!-- Selector de Punto Neurálgico -->
    <div class="form-group">
      <label for="select-ubicacion">Punto Neurálgico / Zona</label>
      <select id="select-ubicacion">
        <option value="Port - Moll Adossat (Creuers)">🚢 Port - Moll Adossat (Creuers)</option>
        <option value="Aeroport T1 (Sortides/Arribades)">✈️ Aeroport T1 (Sortides/Arribades)</option>
        <option value="Aeroport T2">✈️ Aeroport T2</option>
        <option value="Estació de Sants">🚆 Estació de Sants</option>
        <option value="Estació del Nord">🚌 Estació del Nord</option>
        <option value="Plaça Catalunya / Centre">📍 Plaça Catalunya / Centre</option>
        <option value="Fira Gran Via (Hospitalet)">🏢 Fira Gran Via (Hospitalet)</option>
        <option value="Passeig Marítim / Ciutadella">🌊 Passeig Marítim / Ciutadella</option>
      </select>
    </div>

    <!-- Selector de Tipo de Reporte -->
    <div class="form-group">
      <label for="select-tipo">Tipo de Estado / Reporte</label>
      <select id="select-tipo">
        <option value="🟡 Alta Demanda">🟡 Alta Demanda</option>
        <option value="🟢 Zona Despejada / Fluida">🟢 Zona Despejada / Fluida</option>
        <option value="⛔ Vía Colapsada / Retención">⛔ Vía Colapsada / Retención</option>
        <option value="🚔 Control / Tráfico Denso">🚔 Control / Tráfico Denso</option>
        <option value="🔴 ALERTA AMB / SOS">🔴 ALERTA AMB / SOS</option>
      </select>
    </div>

    <!-- Botón Transmitir -->
    <button id="btn-transmitir" class="btn-transmitir">
      📡 Transmitir Aviso a la Red
    </button>

    <!-- Única Consola en Pantalla -->
    <div class="consola-wrapper">
      <div id="consola" class="consola-texto">⚡ Conectando con motor WebAssembly...</div>
    </div>
  </div>

  <!-- Lógica WebAssembly Rust -->
  <script type="module">
    import init, { emitir_aviso } from './pkg/taxi_soberan_barcelona.js';

    async function run() {
      try {
        await init();
        const consola = document.getElementById('consola');
        const btnTransmitir = document.getElementById('btn-transmitir');
        const selectUbicacion = document.getElementById('select-ubicacion');
        const selectTipo = document.getElementById('select-tipo');

        consola.innerText = "⚡ Motor Rust conectado y listo.";

        btnTransmitir.addEventListener('click', () => {
          const ubicacion = selectUbicacion.value;
          const tipo = selectTipo.value;
          
          // Ejecuta la función de Rust
          const respuesta = emitir_aviso(tipo, ubicacion);
          consola.innerText = respuesta;
        });
      } catch (err) {
        document.getElementById('consola').innerText = "❌ Error al iniciar WebAssembly: " + err;
      }
    }

    run();
  </script>
</body>
</html>
